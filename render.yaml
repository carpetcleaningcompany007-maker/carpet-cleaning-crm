services:
  - type: web
    name: carpet-cleaning-crm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    disk:
      name: crm-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CRM_DB_PATH
        value: /data/crm.db
      - key: CRM_BACKUP_DIR
        value: /data/backups
      - key: CRM_UPLOAD_FOLDER
        value: /data/uploads
      - key: CRM_PUBLIC_BASE_URL
        value: https://carpet-cleaning-crm.onrender.com
      - key: CRM_SECRET_KEY
        sync: false
      - key: AUTOMATION_SECRET
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: CLICKSEND_WEBHOOK_SECRET
        sync: false
      - key: MFA_BOOTSTRAP_TOKEN
        sync: false
      - key: CUSTOMER_UPDATE_LINK_DAYS
        value: "30"
      - key: CRM_ASSISTANT_API_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
