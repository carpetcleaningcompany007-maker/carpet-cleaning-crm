{% if dashboard_finished %}<details class="dashboard-finished"><summary>Finished today ({{ dashboard_finished|length }})</summary>{% for job in dashboard_finished %}<p><a href="{{ url_for('job_view',job_id=job.id) }}">{{ job.customer_name }}</a>{% if job.customer_id %} · <a href="{{ url_for('customer_conversation',customer_id=job.customer_id) }}">Messages &amp; history</a>{% endif %}</p>{% endfor %}</details>{% endif %}
